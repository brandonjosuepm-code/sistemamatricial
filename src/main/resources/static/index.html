<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Distribución de Medicamentos</title>
    <style>
        /* Aquí puedes poner después los estilos si quieres, o dejarlo así */
        body {
            font-family: Arial;
            background: #eee;
        }
        .contenedor {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            text-align: center;
            border-radius: 10px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Distribución de Medicamentos</h1>
        
        <input id="centro" placeholder="Centro de salud">
        <input id="medicamento" placeholder="Medicamento">
        <input id="disponible" type="number" placeholder="Disponible">
        <input id="necesario" type="number" placeholder="Necesario">
        
        <button onclick="calcular()">Calcular</button>
        
        <p id="resultado"></p>
    </div>

    <script>
        function calcular() {
            let disponible = Number(
                document.getElementById("disponible").value
            );
            
            let necesario = Number(
                document.getElementById("necesario").value
            );
            
            let distribuir = Math.min(disponible, necesario);
            let faltante = necesario - distribuir;

            document.getElementById("resultado").innerHTML = 
                "Distribuir: " + distribuir + "<br>Faltante: " + faltante;
        }
    </script>

</body>
</html>
