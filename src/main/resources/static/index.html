<!DOCTYPE html>

<html>
    <head>
        <title>Sistema Matricial - Distribución de Medicamentos</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        textarea { width: 100%; height: 200px; font-family: monospace; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2980b9; }
        pre { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 4px; overflow-x: auto; }
    </style>
    </head>
    <body>
        <div class="container">
        <h1>Optimización Matricial de Medicamentos</h1>
        <p>Modifica el JSON de entrada según tus centros, medicamentos, disponibilidades y requerimientos:</p>
        
        <textarea id="jsonInput">{
    "centros": ["Hospital Central", "Clinica Norte", "Centro Sur"],
    "medicamentos": ["Paracetamol", "Ibuprofeno", "Amoxicilina"],
    "disponibilidad": [500, 300, 200],
    "requerimientos": [
        [150, 100, 50],
        [200, 150, 80],
        [100, 50, 40]
    ]
}</textarea>
        <br>
        <button onclick="enviarDatos()">Procesar Distribución</button>

        <h3>Resultado del Servidor:</h3>
        <pre id="resultado">Esperando ejecución...</pre>
    </div>

    <script>
        async function enviarDatos() {
            const url = '/api/sistemamatricial/procesar';
            const jsonText = document.getElementById('jsonInput').value;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: jsonText
                });

                const data = await response.json();
                document.getElementById('resultado').innerText = JSON.stringify(data, null, 4);
            } catch (error) {
                document.getElementById('resultado').innerText = 'Error al conectar con el servidor: ' + error;
            }
        }
    </script>
    </body>
</html>
